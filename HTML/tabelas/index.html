<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas HTML</title>
</head>
<body>
    <table border="3">
        <caption>Usuários Matriculados</caption>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Sexo</th>
            </tr>
        </thead>

        <tbody>
            <tr>
            <td>Gilmar</td>
            <td>40</td>
            <td rowspan="4" align="center">M</td>
        </tr>
        <tr>
            <td>Antonio</td>
            <td>35</td>
            
            </tr>
            <tr>
                <td>Zezin</td>
                <td>23</td>
                
            </tr>
            <tr>
                <td>Toin</td>
                <td>52</td>
               
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Qtd Usuarios</td>
                <td colspan="2" align="right"><mark>4</mark></td>
            </tr>
        </tfoot>
        
    </table>
    

</body>
</html>
