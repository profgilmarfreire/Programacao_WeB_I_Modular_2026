<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora JS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="container">
        <div id="calculadora">
            <div id="tela">
                <input id="userTela" type="text" value="0">
            </div>
            <div id="teclas">
                <button class="btnFormat" id="btn1">1</button>
                <button class="btnFormat" id="btn2">2</button>
                <button class="btnFormat" id="btn3">3</button>
                <button class="btnFormat" id="btnMais">+</button>


                <button class="btnFormat" id="btn4">4</button>
                <button class="btnFormat" id="btn5">5</button>
                <button class="btnFormat" id="btn6">6</button>
                <button class="btnFormat" id="btnMenos">-</button>

                <button class="btnFormat" id="btn7">7</button>
                <button class="btnFormat" id="btn8">8</button>
                <button class="btnFormat" id="btn9">9</button>
                <button class="btnFormat" id="btnMult">x</button>
                
                <button class="btnFormat" id="btnClear">CE</button>                
                <button class="btnFormat" id="btn0">0</button>
                <button class="btnFormat" id="btnDel">DEL</button>
                <button class="btnFormat" id="btnDiv">/</button>
                <button class="btnFormat btEqual" id="btnEqual">=</button>                   
                
            </div>
        </div>
    </div>


    <script src="js/app.js"></script>
</body>
</html>
